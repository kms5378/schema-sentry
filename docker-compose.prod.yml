x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-security: &security
  security_opt:
    - no-new-privileges:true

x-airflow-production-environment: &airflow-production-environment
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set AIRFLOW_JWT_SECRET}
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD}@airflow-db:5432/airflow
  SCHEMA_SENTRY_API_KEY: ${SCHEMA_SENTRY_API_KEY:?set SCHEMA_SENTRY_API_KEY}
  SOURCE_DATABASE_URL: postgresql://schema_sentry_pipeline:${SOURCE_DB_PIPELINE_PASSWORD:?set SOURCE_DB_PIPELINE_PASSWORD}@source-db:5432/game_source

services:
  source-db:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${SOURCE_DB_ADMIN_PASSWORD:?set SOURCE_DB_ADMIN_PASSWORD}
      SCHEMA_SENTRY_SOURCE_READER_PASSWORD: ${SOURCE_DB_READER_PASSWORD:?set SOURCE_DB_READER_PASSWORD}
    restart: unless-stopped
    <<: *security
    logging: *json-logging

  source-permissions-init:
    environment:
      PGPASSWORD: ${SOURCE_DB_ADMIN_PASSWORD:?set SOURCE_DB_ADMIN_PASSWORD}
      SCHEMA_SENTRY_PIPELINE_PASSWORD: ${SOURCE_DB_PIPELINE_PASSWORD:?set SOURCE_DB_PIPELINE_PASSWORD}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    restart: "no"
    <<: *security
    logging: *json-logging

  metadata-db:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${METADATA_DB_PASSWORD:?set METADATA_DB_PASSWORD}
    restart: unless-stopped
    <<: *security
    logging: *json-logging

  metadata-migrate:
    build:
      context: .
    command: [".venv/bin/alembic", "upgrade", "head"]
    environment:
      SCHEMA_SENTRY_ALEMBIC_DATABASE_URL: postgresql+psycopg://schema_sentry:${METADATA_DB_PASSWORD:?set METADATA_DB_PASSWORD}@metadata-db:5432/schema_sentry
    depends_on:
      metadata-db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    restart: "no"
    <<: *security
    logging: *json-logging

  airflow-db:
    environment:
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD}
    restart: unless-stopped
    <<: *security
    logging: *json-logging

  mailpit:
    ports: !reset []
    restart: unless-stopped
    <<: *security
    logging: *json-logging

  api:
    ports: !reset []
    environment:
      SCHEMA_SENTRY_ENVIRONMENT: production
      SCHEMA_SENTRY_METADATA_DATABASE_URL: postgresql+psycopg://schema_sentry:${METADATA_DB_PASSWORD:?set METADATA_DB_PASSWORD}@metadata-db:5432/schema_sentry
      SCHEMA_SENTRY_ALEMBIC_DATABASE_URL: postgresql+psycopg://schema_sentry:${METADATA_DB_PASSWORD:?set METADATA_DB_PASSWORD}@metadata-db:5432/schema_sentry
      SCHEMA_SENTRY_SOURCE_DATABASE_URL: postgresql+psycopg://schema_sentry_reader:${SOURCE_DB_READER_PASSWORD:?set SOURCE_DB_READER_PASSWORD}@source-db:5432/game_source
      SCHEMA_SENTRY_API_KEY: ${SCHEMA_SENTRY_API_KEY:?set SCHEMA_SENTRY_API_KEY}
      SCHEMA_SENTRY_AUTH_DISABLED: "false"
      SCHEMA_SENTRY_TRUST_PROXY_AUTH: "true"
      SCHEMA_SENTRY_DASHBOARD_BASE_URL: ${SCHEMA_SENTRY_DASHBOARD_BASE_URL:?set SCHEMA_SENTRY_DASHBOARD_BASE_URL}
    depends_on:
      metadata-migrate:
        condition: service_completed_successfully
      source-db:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    restart: unless-stopped
    <<: *security
    logging: *json-logging

  airflow-init:
    environment: *airflow-production-environment
    restart: "no"
    <<: *security
    logging: *json-logging

  airflow-api-server:
    ports: !reset []
    environment: *airflow-production-environment
    restart: unless-stopped
    <<: *security
    logging: *json-logging

  airflow-scheduler:
    environment: *airflow-production-environment
    restart: unless-stopped
    <<: *security
    logging: *json-logging

  airflow-dag-processor:
    environment: *airflow-production-environment
    restart: unless-stopped
    <<: *security
    logging: *json-logging

  caddy:
    image: caddy:2.11.4-alpine
    environment:
      SCHEMA_SENTRY_DOMAIN: ${SCHEMA_SENTRY_DOMAIN:?set SCHEMA_SENTRY_DOMAIN}
      SCHEMA_SENTRY_ADMIN_USER: ${SCHEMA_SENTRY_ADMIN_USER:?set SCHEMA_SENTRY_ADMIN_USER}
      SCHEMA_SENTRY_ADMIN_HASH: ${SCHEMA_SENTRY_ADMIN_HASH:?set SCHEMA_SENTRY_ADMIN_HASH}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
    <<: *security
    logging: *json-logging

volumes:
  caddy-data:
  caddy-config:
