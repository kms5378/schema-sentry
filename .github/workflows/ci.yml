name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: docker compose up -d --wait source-db source-permissions-init metadata-db mailpit
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src
      - name: Test
        env:
          SCHEMA_SENTRY_SOURCE_DATABASE_URL: postgresql+psycopg://schema_sentry_reader:source_reader_dev@localhost:55432/game_source
        run: uv run pytest --cov=src/schema_sentry --cov-report=term-missing --cov-fail-under=85
      - name: Test Airflow DAGs
        run: |
          docker compose build airflow-api-server
          docker compose run --rm --no-deps airflow-api-server bash -c 'pytest /opt/airflow/tests -q'
